name: Build Universal Translator APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-translator-android-build
  cancel-in-progress: true

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out builder
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out private application source
        uses: actions/checkout@v4
        with:
          repository: loudply0-eng/Universal-Translator
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        working-directory: source
        run: flutter create --platforms=android --org com.loudply.universaltranslator --project-name universal_translator .

      - name: Resolve dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Build release APK
        working-directory: source
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: universal-translator-0.1.0
          path: source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
