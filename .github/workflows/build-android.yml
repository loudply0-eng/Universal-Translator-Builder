name: Build Universal Translator APK

"on":
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a signed GitHub Release for in-app updates (requires the persistent signing secrets)."
        required: false
        default: false
        type: boolean
      source_ref:
        description: "Private source branch or tag to build (defaults to main)."
        required: false
        default: main
        type: string
  push:
    branches:
      - main

# A push containing the official-release marker publishes the signed APK for in-app updates.

permissions:
  contents: write

concurrency:
  group: universal-translator-android-build-v2
  cancel-in-progress: true

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out private application source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: loudply0-eng/Universal-Translator
          # Guarded push-trigger fallback: build the latest private source branch for the exact official-release marker.
          ref: ${{ inputs.source_ref || (github.event_name == 'push' && contains(github.event.head_commit.message, '[official-release:v0.3.7+11]') && 'main') || 'main' }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Fetch pinned Arabic OCR model and license
        working-directory: source
        run: python3 scripts/fetch_arabic_ocr_model.py

      - name: Verify in-app updater source and release version
        working-directory: source
        run: |
          grep -Fq "isNewerVersion" lib/services/update_service.dart || {
            echo "The in-app update version checker is missing" >&2
            exit 1
          }
          grep -Fq "showNoUpdateMessage" lib/main.dart || {
            echo "Automatic startup update checks are missing" >&2
            exit 1
          }
          grep -Fq "if (kReleaseMode)" lib/main.dart || {
            echo "Startup network checks must be limited to production builds" >&2
            exit 1
          }
          grep -Fq "tesseract_ocr: ^0.6.0" pubspec.yaml || {
            echo "Arabic Tesseract OCR dependency is missing" >&2
            exit 1
          }

          test -s lib/services/arabic_dialect_service.dart
          grep -Fq 'IraqiArabicDialect.apply' lib/services/translation_service.dart || {
            echo "Iraqi Arabic localization is missing from online translations" >&2
            exit 1
          }
          grep -Fq 'IraqiArabicDialect.apply' lib/services/offline_translation_service.dart || {
            echo "Iraqi Arabic localization is missing from offline translations" >&2
            exit 1
          }
          grep -Fq 'bool _speakAutomatically = true;' lib/pages/live_meeting_page.dart || {
            echo "Automatic lecture speech must be enabled by default" >&2
            exit 1
          }
          grep -Fq '_speechQueue = _speechQueue.then' lib/pages/live_meeting_page.dart || {
            echo "Lecture speech queue is missing" >&2
            exit 1
          }
          test -s assets/tessdata_config.json
          test -s assets/tessdata/ara.traineddata
          grep -Fq '"ara.traineddata"' assets/tessdata_config.json || {
            echo "Arabic OCR trained-data asset is not declared" >&2
            exit 1
          }
          python3 - <<'PY'
          from pathlib import Path
          import re
          content = Path("pubspec.yaml").read_text(encoding="utf-8")
          match = re.search(r"^version:[ ]*([0-9]+[.][0-9]+[.][0-9]+[+][0-9]+)[ ]*$", content, re.M)
          if not match:
              raise SystemExit("pubspec.yaml version must use MAJOR.MINOR.PATCH+BUILD")
          version = match.group(1)
          print(f"Application version: {version}")
          changelog = Path("CHANGELOG.md")
          if not changelog.is_file():
              raise SystemExit("CHANGELOG.md is required for every release")
          if f"## {version}" not in changelog.read_text(encoding="utf-8").splitlines():
              raise SystemExit(f"CHANGELOG.md is missing section ## {version}")
          print(f"Release notes found for {version}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.1'
          cache: true

      - name: Generate Android platform project
        working-directory: source
        run: flutter create --platforms=android --org com.loudply.universaltranslator --project-name universal_translator .

      - name: Configure Android text and image sharing
        run: python3 scripts/configure_android_share_intents.py

      - name: Generate complete Android launcher icons
        working-directory: source
        run: |
          if [ ! -f assets/launcher_icon.svg ] || [ ! -f assets/launcher_icon_foreground.svg ]; then
            echo "This source ref does not yet include the new launcher artwork; keeping its existing icon."
            exit 0
          fi
          python3 -m pip install --disable-pip-version-check cairosvg
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="assets/launcher_icon.svg", write_to="assets/launcher_icon.png", output_width=1024, output_height=1024)
          cairosvg.svg2png(url="assets/launcher_icon_foreground.svg", write_to="assets/launcher_icon_foreground.png", output_width=1024, output_height=1024)
          PY
          grep -Fq 'flutter_launcher_icons:' pubspec.yaml || {
            echo "Launcher icon configuration is missing" >&2
            exit 1
          }
          flutter pub get
          dart run flutter_launcher_icons
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Configure persistent Android release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/configure_android_signing.py

      - name: Allow network access for translation requests
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />',
          ]
          for permission in permissions:
              permission_name = permission.split('"')[1]
              if permission_name not in content:
                  content = content.replace("<application", permission + "\n    <application", 1)
          queries = """    <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
          """
          if "android.speech.RecognitionService" not in content:
              content = content.replace("<application", queries + "\n    <application", 1)

          # Declare the foreground service used by the user-requested floating translation window.
          overlay_service = """    <service
                  android:name="flutter.overlay.window.flutter_overlay_window.OverlayService"
                  android:exported="false"
                  android:foregroundServiceType="specialUse">
                  <property
                      android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                      android:value="User-requested floating translation window" />
              </service>
          """
          if "flutter.overlay.window.flutter_overlay_window.OverlayService" not in content:
              content = content.replace("</application>", overlay_service + "\n</application>", 1)
          manifest.write_text(content, encoding="utf-8")

          # Bundle the optional ML Kit recognizers used for Chinese, Japanese,
          # Korean, and Devanagari source-language OCR.
          gradle_kts = Path("android/app/build.gradle.kts")
          gradle_groovy = Path("android/app/build.gradle")
          dependencies = [
              "com.google.mlkit:text-recognition-chinese:16.0.1",
              "com.google.mlkit:text-recognition-japanese:16.0.1",
              "com.google.mlkit:text-recognition-korean:16.0.1",
              "com.google.mlkit:text-recognition-devanagari:16.0.1",
          ]
          if gradle_kts.is_file():
              gradle = gradle_kts
              content = gradle.read_text(encoding="utf-8")
              kotlin_dsl = True
          elif gradle_groovy.is_file():
              gradle = gradle_groovy
              content = gradle.read_text(encoding="utf-8")
              kotlin_dsl = False
          else:
              raise SystemExit("Could not locate Android app Gradle build file")

          marker = "dependencies {"
          if marker not in content:
              content = content.rstrip() + "\n\n" + marker + "\n}\n"
          opening = content.index(marker) + len(marker)
          closing = content.find("\n}", opening)
          if closing < 0:
              raise SystemExit("Could not locate the closing brace of the app dependencies block")
          dependency_body = content[opening:closing]

          additions = []
          for dep in dependencies:
              coordinate = re.escape(dep)
              if not re.search(r"implementation\s*\(?\s*['\"]" + coordinate + r"['\"]\s*\)?", dependency_body):
                  if kotlin_dsl:
                      additions.append(f'    implementation("{dep}")')
                  else:
                      additions.append(f"    implementation '{dep}'")

          if additions:
              content = content[:opening] + "\n" + "\n".join(additions) + content[opening:]

          for dep in dependencies:
              coordinate = re.escape(dep)
              if not re.search(r"implementation\s*\(?\s*['\"]" + coordinate + r"['\"]\s*\)?", content):
                  raise SystemExit(f"Required ML Kit runtime dependency was not added: {dep}")
              print(f"Verified app runtime dependency: {dep}")

          gradle.write_text(content, encoding="utf-8")
          PY

      - name: Verify Android network permission
        working-directory: source
        run: |
          grep -Fq 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || {
            echo "Android INTERNET permission is missing" >&2
            exit 1
          }
          grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml || {
            echo "Android package installer permission is missing" >&2
            exit 1
          }
          grep -Fq 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml || {
            echo "Android microphone permission is missing" >&2
            exit 1
          }
          grep -Fq 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml || {
            echo "Android camera permission is missing" >&2
            exit 1
          }
          grep -Fq 'android.speech.RecognitionService' android/app/src/main/AndroidManifest.xml || {
            echo "Android speech recognition query is missing" >&2
            exit 1
          }
          grep -Fq 'android.permission.SYSTEM_ALERT_WINDOW' android/app/src/main/AndroidManifest.xml || {
            echo "Android overlay permission is missing" >&2
            exit 1
          }
          grep -Fq 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' android/app/src/main/AndroidManifest.xml || {
            echo "Android special-use foreground service permission is missing" >&2
            exit 1
          }
          grep -Fq 'flutter.overlay.window.flutter_overlay_window.OverlayService' android/app/src/main/AndroidManifest.xml || {
            echo "Floating translation overlay service is missing" >&2
            exit 1
          }
          grep -Fq 'android.intent.action.PROCESS_TEXT' android/app/src/main/AndroidManifest.xml || {
            echo "Android text-selection translation intent is missing" >&2
            exit 1
          }
          grep -Fq 'android.intent.action.SEND' android/app/src/main/AndroidManifest.xml || {
            echo "Android sharing integration is missing" >&2
            exit 1
          }
          grep -Fq 'shared_content' android/app/src/main/kotlin/com/loudply/universaltranslator/universal_translator/MainActivity.kt || {
            echo "Android shared-content bridge is missing" >&2
            exit 1
          }

      - name: Resolve dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Build release APK
        working-directory: source
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Verify APK signing mode
        id: verify_signing
        working-directory: source
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          EXPECTED_CERT_SHA256: "a701805816d8a5ecae5ca45117cb42592f279b3f5a05fead40886e11ee8d2c15"
          EXPECTED_APPLICATION_ID: "com.loudply.universaltranslator.universal_translator"
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ "$SIGNING_ENABLED" != "true" ]; then
            echo "Persistent production signing is not configured; refusing to produce a distributable APK." >&2
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
            echo "Android apksigner or aapt tool was not found" >&2
            exit 1
          fi

          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNATURE_OUTPUT"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$SIGNATURE_OUTPUT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "APK signing certificate does not match the pinned persistent release certificate." >&2
            exit 1
          fi

          printf '%s\n' "$SIGNATURE_OUTPUT" | grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' || {
            echo "APK Signature Scheme v2 verification failed." >&2
            exit 1
          }

          ACTUAL_APPLICATION_ID="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          if [ "$ACTUAL_APPLICATION_ID" != "$EXPECTED_APPLICATION_ID" ]; then
            echo "Unexpected APK application ID: $ACTUAL_APPLICATION_ID" >&2
            exit 1
          fi

          python3 - "$APK" <<'PY'
          from pathlib import Path
          import hashlib
          import sys
          import zipfile

          apk = Path(sys.argv[1])
          expected = {
              "assets/flutter_assets/assets/tessdata/ara.traineddata": (
                  12603724, "4b687c7d54c86cf6219aebe781b47284fd5d41f0"
              ),
              "assets/flutter_assets/assets/tessdata/LICENSE-APACHE-2.0.txt": (
                  None, "d645695673349e3947e8e5ae42332d0ac3164cd7"
              ),
          }
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              for name, (expected_size, expected_blob) in expected.items():
                  if name not in names:
                      raise SystemExit(f"Required OCR asset is missing from APK: {name}")
                  data = archive.read(name)
                  if expected_size is not None and len(data) != expected_size:
                      raise SystemExit(f"Unexpected OCR asset size in APK: {name}")
                  actual_blob = hashlib.sha1(
                      b"blob " + str(len(data)).encode("ascii") + b"\0" + data
                  ).hexdigest()
                  if actual_blob != expected_blob:
                      raise SystemExit(f"Packaged OCR asset failed integrity verification: {name}")
                  print(f"Verified APK asset: {name} ({len(data)} bytes)")
          PY

          echo "certificate_sha256=$ACTUAL_CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "Verified fixed application ID and persistent signing certificate."

      - name: Generate APK checksum and build manifest
        id: build_metadata
        working-directory: source
        run: |
          APP_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)"
          if [ -z "$APP_VERSION" ]; then
            echo "Could not read app version from pubspec.yaml" >&2
            exit 1
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          sha256sum "$APK" > "$APK.sha256"
          {
            printf 'app_version=%s\n' "$APP_VERSION"
            printf 'source_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'builder_commit=%s\n' "$GITHUB_SHA"
            printf 'application_id=%s\n' "com.loudply.universaltranslator.universal_translator"
            printf 'signing_mode=%s\n' "$(cat build/signing-mode.txt)"
            printf 'signing_certificate_sha256=%s\n' "${{ steps.verify_signing.outputs.certificate_sha256 }}"
            printf 'arabic_ocr_model_upstream_commit=%s\\n' "9ddc24e750eec0994223a9edc3fcb434a2244f3b"
            printf 'arabic_ocr_license_upstream_commit=%s\\n' "87416418657359cb625c412a48b6e1d6d41c29bd"
            printf 'arabic_ocr_model_git_blob_sha1=%s\n' "4b687c7d54c86cf6219aebe781b47284fd5d41f0"
            printf 'flutter_version=%s\n' "$(flutter --version | sed -n '1p')"
          } > build/build-info.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: universal-translator-${{ steps.build_metadata.outputs.app_version }}
          path: |
            source/build/app/outputs/flutter-apk/app-release.apk
            source/build/app/outputs/flutter-apk/app-release.apk.sha256
            source/build/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed GitHub Release for in-app updates
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[official-release:v0.3.7+11]')) }}
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          APP_VERSION: ${{ steps.build_metadata.outputs.app_version }}
        run: |
          if [ "$SIGNING_ENABLED" != "true" ]; then
            echo "Refusing to publish: persistent Android signing secrets are not configured." >&2
            exit 1
          fi
          if ! [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "Refusing to publish: pubspec version must be MAJOR.MINOR.PATCH+BUILD." >&2
            exit 1
          fi
          TAG="v$APP_VERSION"
          if gh release view "$TAG" --repo loudply0-eng/Universal-Translator-Builder >/dev/null 2>&1; then
            echo "Release $TAG already exists. Increase the app version before publishing again." >&2
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk universal-translator.apk
          sha256sum universal-translator.apk > universal-translator.apk.sha256

          NOTES_FILE="$(mktemp)"
          python3 - "$APP_VERSION" CHANGELOG.md "$NOTES_FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          version, changelog_path, output_path = sys.argv[1:]
          lines = Path(changelog_path).read_text(encoding="utf-8").splitlines()
          heading = f"## {version}"
          try:
              start = next(i for i, line in enumerate(lines) if line.strip() == heading)
          except StopIteration:
              raise SystemExit(f"Missing release notes section: {heading}")
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")),
              len(lines),
          )
          notes = "\n".join(lines[start + 1:end]).strip()
          if not notes:
              raise SystemExit(f"Release notes section is empty: {heading}")
          arabic_letters = len(re.findall(r"[\u0600-\u06FF]", notes))
          latin_letters = len(re.findall(r"[A-Za-z]", notes))
          if arabic_letters < 20 or latin_letters > max(12, arabic_letters // 3):
              raise SystemExit("Release notes must be primarily written in Arabic.")
          Path(output_path).write_text(
              notes + "\n\n---\nتم فحص سلامة حزمة التثبيت قبل فتح مُثبّت النظام. يتطلب التثبيت موافقتك.\n",
              encoding="utf-8",
          )
          PY

          gh release create "$TAG" universal-translator.apk universal-translator.apk.sha256 \
            --repo loudply0-eng/Universal-Translator-Builder \
            --target "$GITHUB_SHA" \
            --title "Universal Translator $APP_VERSION" \
            --notes-file "$NOTES_FILE"
