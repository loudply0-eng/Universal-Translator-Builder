name: Build Universal Translator APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-translator-android-build
  cancel-in-progress: true

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out private application source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: loudply0-eng/Universal-Translator
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.1'
          cache: true

      - name: Generate Android platform project
        working-directory: source
        run: flutter create --platforms=android --org com.loudply.universaltranslator --project-name universal_translator .

      - name: Resolve dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Build release APK
        working-directory: source
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: universal-translator-0.1.0
          path: source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
