name: Builder and private-source security checks

on:
  push:
    branches: [main, feature/0.3.3-screen-capture-permissions]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: builder-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  builder-secret-scan:
    name: Scan public builder for leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out builder with history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Android signing setup scripts
        run: |
          python3 -m py_compile scripts/configure_android_signing.py
          bash -n scripts/setup-android-signing.sh

      - name: Scan builder history for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the complete builder Git history
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --exit-code=2 --log-opts="--all" /repo

  private-source-security:
    # Never expose the private-source token to pull_request workflows.
    if: github.event_name != 'pull_request'
    name: Scan and test private application source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out private application source with history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: loudply0-eng/Universal-Translator
          ref: ${{ github.ref_name == 'feature/0.3.3-screen-capture-permissions' && 'feature/0.3.3-unified-translation' || 'main' }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify private source candidate version and aligned ML Kit dependencies
        run: |
          grep -Fq 'version: 0.5.1+17' pubspec.yaml || {
            echo "Private source candidate must be version 0.5.1+17" >&2
            exit 1
          }
          grep -Fq 'google_mlkit_translation: ^1.0.3' pubspec.yaml || {
            echo "On-device translation dependency is missing" >&2
            exit 1
          }
          grep -Fq 'google_mlkit_text_recognition: ^1.0.3' pubspec.yaml || {
            echo "Text-recognition dependency is missing" >&2
            exit 1
          }
          grep -Fq 'sdk: ">=3.12.0 <4.0.0"' pubspec.yaml || {
            echo "Dart SDK requirement for ML Kit 1.0.3 is missing" >&2
            exit 1
          }
          grep -Fq 'package_info_plus: ^10.2.2' pubspec.yaml || {
            echo "Package information dependency must support file_picker's win32 version" >&2
            exit 1
          }
          grep -Fq 'localizedCandidate' lib/services/translation_service.dart || {
            echo "Iraqi localization for Arabic translation alternatives is missing" >&2
            exit 1
          }
          grep -Fq 'expectedSize: expectedSize' lib/services/update_service.dart || {
            echo "Updater release asset size tracking is missing" >&2
            exit 1
          }
          test -s lib/services/translation_overlay_service.dart || {
            echo "Safe overlay controller is missing" >&2
            exit 1
          }
          test -s lib/services/pdf_document_text_extractor.dart || {
            echo "Scanned PDF text extractor is missing" >&2
            exit 1
          }
          grep -Fq 'static const int maximumOcrPages = 30' lib/services/pdf_document_text_extractor.dart || {
            echo "Scanned PDF OCR resource limit is missing" >&2
            exit 1
          }
          grep -Fq 'await _ocr.recognize(' lib/services/pdf_document_text_extractor.dart || {
            echo "Scanned PDF pages must use local OCR" >&2
            exit 1
          }
          test -s test/pdf_document_text_extractor_test.dart || {
            echo "Scanned PDF OCR regression tests are missing" >&2
            exit 1
          }
          grep -Fq 'TranslationEngineMode.automatic' lib/services/translation_service.dart || {
            echo "Smart translation routing is missing" >&2
            exit 1
          }
          grep -Fq '_offlineFallback' lib/services/translation_service.dart || {
            echo "Offline fallback service is missing" >&2
            exit 1
          }
          test -s test/translation_glossary_test.dart
          test -s test/translation_glossary_page_test.dart
          test -s lib/services/translation_glossary.dart
          test -s lib/pages/translation_glossary_page.dart
          test -s lib/services/subtitle_document.dart
          test -s test/subtitle_document_test.dart
          grep -Fq 'SubtitleDocument.parse' lib/pages/document_translation_page.dart || {
            echo "Subtitle file parser integration is missing" >&2
            exit 1
          }
          grep -Fq 'automatic mode falls back to local translation' test/translation_service_test.dart || {
            echo "Offline routing regression tests are missing" >&2
            exit 1
          }
          grep -Fq 'applies saved glossary terms during an actual translation request' test/translation_service_test.dart || {
            echo "Glossary integration tests are missing" >&2
            exit 1
          }
          grep -Fq 'width: compactWidth' lib/services/translation_overlay_service.dart || {
            echo "Overlay must not use full-screen default width" >&2
            exit 1
          }
          grep -Fq 'height: compactHeight' lib/services/translation_overlay_service.dart || {
            echo "Overlay must not use full-screen default height" >&2
            exit 1
          }
          test -s test/translation_overlay_service_test.dart || {
            echo "Overlay regression tests are missing" >&2
            exit 1
          }
          if grep -Fq 'maximumApkBytes' lib/services/update_service.dart; then
            echo "Updater must not impose an artificial APK download ceiling" >&2
            exit 1
          fi
          grep -Fq 'localizes and deduplicates Arabic alternatives' test/translation_service_test.dart || {
            echo "Iraqi translation-alternatives regression test is missing" >&2
            exit 1
          }
          grep -Fq 'http.Response.bytes(' test/translation_service_test.dart || {
            echo "Alternative translation UTF-8 test fixture is missing" >&2
            exit 1
          }

      - name: Fetch and verify pinned Arabic OCR model and license
        run: python3 scripts/fetch_arabic_ocr_model.py

      - name: Scan private source history for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the complete private-source Git history
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --exit-code=2 --log-opts="--all" /repo

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.1'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Scan Flutter dependencies for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@0e457b42d0120153c352875e9b758b1e5c58c7e5 # v2.7.1
        with:
          scan-args: |-
            --lockfile=pubspec.lock

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
